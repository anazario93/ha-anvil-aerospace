# Anvil Aerospace — authentic cockpit MFD palette
# Inspired by the cyan displays, blue panel layers, and lime status indicators
# of Anvil Aerospace ship interfaces in Star Citizen.

Anvil Aerospace:
  # Core display colors
  primary-color: "#8CCFB8"
  accent-color: "#A8E6D0"
  mdc-theme-primary: "#8CCFB8"
  mdc-button-outline-color: "#8CCFB8"
  paper-button-ink-color: "#A8E6D0"
  primary-text-color: "#D7F5F2"
  secondary-text-color: "#79AEB8"
  disabled-text-color: "#456B78"
  text-primary-color: "#071A23"

  # Cockpit surfaces
  primary-background-color: "#0B202B"
  secondary-background-color: "#16434C"
  card-background-color: "#1B5960"
  ha-card-background: "#1B5960"
  lovelace-background: 'center / cover no-repeat fixed url("https://raw.githubusercontent.com/anazario93/ha-anvil-aerospace/main/images/anvil_mfd_bg.jpg.jpg")'
  app-header-background-color: "#0A1B25"
  app-header-text-color: "#BCEFED"
  sidebar-background-color: "#0A1B25"
  sidebar-text-color: "#80AEB7"
  sidebar-selected-background-color: "#174353"
  sidebar-selected-icon-color: "#A8E6D0"
  divider-color: "#347F80"

  # Borders and subtle illumination
  ha-card-border-color: "#347F80"
  ha-card-border-radius: "4px"
  ha-card-box-shadow: "0 0 8px rgba(38, 190, 200, 0.08)"
  outline-color: "#34788A"
  outline-hover-color: "#39D5D8"
  state-outline-color: "#245365"

  # Interactive controls
  paper-slider-active-color: "#8CCFB8"
  paper-slider-secondary-color: "#245365"
  paper-slider-knob-color: "#A8E6D0"
  paper-toggle-button-checked-button-color: "#A8E6D0"
  paper-toggle-button-checked-bar-color: "#477F70"
  paper-toggle-button-unchecked-button-color: "#64818A"
  paper-toggle-button-unchecked-bar-color: "#294653"
  switch-checked-color: "#A8E6D0"
  switch-checked-button-color: "#A8E6D0"
  switch-checked-track-color: "#477F70"
  switch-unchecked-button-color: "#64818A"
  switch-unchecked-track-color: "#294653"
  slider-color: "#8CCFB8"
  slider-secondary-color: "#245365"
  input-fill-color: "#16434C"
  input-fill-color-disabled: "#0D2530"
  input-ink-color: "#D7F5F2"
  input-label-ink-color: "#79AEB8"
  input-idle-line-color: "#347184"
  input-hover-line-color: "#8CCFB8"
  input-disabled-ink-color: "#456B78"

  # Icons and entity states
  state-icon-color: "#79AEB8"
  state-icon-active-color: "#A8E6D0"
  state-active-color: "#B6D58B"
  state-inactive-color: "#456B78"
  paper-item-icon-color: "#79AEB8"
  paper-item-icon-active-color: "#A8E6D0"
  entity-icon-color: "#79AEB8"
  entity-icon-active-color: "#A8E6D0"

  # Status colors — restrained like the MFD annunciators
  state-light: "#B6D58B"
  state-switch: "#B6D58B"
  state-on: "#B6D58B"
  state-off: "#456B78"
  state-unavailable: "#58717A"
  success-color: "#B6D58B"
  warning-color: "#F2D34F"
  error-color: "#FF4058"
  info-color: "#39D5D8"

  # Badges, tables, dialogs, and menus
  label-badge-background-color: "#194657"
  label-badge-text-color: "#D7F5F2"
  paper-dialog-background-color: "#1B5960"
  paper-listbox-background-color: "#1B5960"
  table-row-background-color: "#1B5960"
  table-row-alternative-background-color: "#16434C"
  data-table-background-color: "#1B5960"
  markdown-code-background-color: "#0A1B25"

  # Charts
  graph-color-1: "#39D5D8"
  graph-color-2: "#B6D58B"
  graph-color-3: "#F2D34F"
  graph-color-4: "#4B91B0"
  graph-color-5: "#FF4058"
  graph-color-6: "#8D9EE8"

  # Home Assistant design-token primary palette
  ha-color-primary-05: "#071820"
  ha-color-primary-10: "#0B2631"
  ha-color-primary-20: "#103744"
  ha-color-primary-30: "#185363"
  ha-color-primary-40: "#477F70"
  ha-color-primary-50: "#639F89"
  ha-color-primary-60: "#8CCFB8"
  ha-color-primary-70: "#A8E6D0"
  ha-color-primary-80: "#C4F0DF"
  ha-color-primary-90: "#E0F8EF"
  ha-color-primary-95: "#ECFDFC"

  # Selection
  text-selection-color: "#0B202B"
  text-selection-background-color: "#63F0EA"

  # Typography — same Oxanium setup used by Drake Interplanetary Orange.
  # Oxanium must be loaded as a frontend font resource in Home Assistant.
  primary-font-family: "'Oxanium', sans-serif"
  ha-font-family-body: "'Oxanium', sans-serif"
  ha-font-family-heading: "'Oxanium', sans-serif"
  ha-font-family-code: "'Oxanium', monospace"
  ha-font-family-longform: "'Oxanium', sans-serif"
  ha-card-header-font-family: "'Oxanium', sans-serif"
  paper-font-common-base_-_font-family: "'Oxanium', sans-serif"
  paper-font-body1_-_font-family: "'Oxanium', sans-serif"
  mdc-typography-font-family: "'Oxanium', sans-serif"

  # Dark-mode cockpit palette
  modes:
    dark:
      primary-background-color: "#0B202B"
      secondary-background-color: "#16434C"
      card-background-color: "#1B5960"
      primary-text-color: "#D7F5F2"
      secondary-text-color: "#79AEB8"
