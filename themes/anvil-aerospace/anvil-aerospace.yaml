# Anvil Aerospace — authentic cockpit MFD palette
# Inspired by the cyan displays, blue panel layers, and lime status indicators
# of Anvil Aerospace ship interfaces in Star Citizen.

Anvil Aerospace:
  # Core display colors
  primary-color: "#39D5D8"
  accent-color: "#63F0EA"
  primary-text-color: "#D7F5F2"
  secondary-text-color: "#79AEB8"
  disabled-text-color: "#456B78"
  text-primary-color: "#071A23"

  # Cockpit surfaces
  primary-background-color: "#0B202B"
  secondary-background-color: "#102B38"
  card-background-color: "#123342"
  ha-card-background: "#123342"
  lovelace-background: "#0B202B"
  app-header-background-color: "#0A1B25"
  app-header-text-color: "#BCEFED"
  sidebar-background-color: "#0A1B25"
  sidebar-text-color: "#80AEB7"
  sidebar-selected-background-color: "#174353"
  sidebar-selected-icon-color: "#63F0EA"
  divider-color: "#245365"

  # Borders and subtle illumination
  ha-card-border-color: "#245365"
  ha-card-border-radius: "4px"
  ha-card-box-shadow: "0 0 8px rgba(38, 190, 200, 0.08)"
  outline-color: "#34788A"
  outline-hover-color: "#39D5D8"
  state-outline-color: "#245365"

  # Interactive controls
  paper-slider-active-color: "#39D5D8"
  paper-slider-secondary-color: "#245365"
  paper-slider-knob-color: "#63F0EA"
  paper-toggle-button-checked-button-color: "#63F0EA"
  paper-toggle-button-checked-bar-color: "#268F9A"
  paper-toggle-button-unchecked-button-color: "#64818A"
  paper-toggle-button-unchecked-bar-color: "#294653"
  switch-checked-color: "#63F0EA"
  switch-checked-button-color: "#63F0EA"
  switch-checked-track-color: "#268F9A"
  switch-unchecked-button-color: "#64818A"
  switch-unchecked-track-color: "#294653"
  slider-color: "#39D5D8"
  slider-secondary-color: "#245365"
  input-fill-color: "#102B38"
  input-fill-color-disabled: "#0D2530"
  input-ink-color: "#D7F5F2"
  input-label-ink-color: "#79AEB8"
  input-idle-line-color: "#347184"
  input-hover-line-color: "#39D5D8"
  input-disabled-ink-color: "#456B78"

  # Icons and entity states
  state-icon-color: "#79AEB8"
  state-icon-active-color: "#63F0EA"
  state-active-color: "#B6D58B"
  state-inactive-color: "#456B78"
  paper-item-icon-color: "#79AEB8"
  paper-item-icon-active-color: "#63F0EA"
  entity-icon-color: "#79AEB8"
  entity-icon-active-color: "#63F0EA"

  # Status colors — restrained like the MFD annunciators
  state-light: "#B6D58B"
  state-switch: "#B6D58B"
  state-on: "#B6D58B"
  state-off: "#456B78"
  state-unavailable: "#58717A"
  success-color: "#B6D58B"
  warning-color: "#F2D34F"
  error-color: "#FF4058"
  info-color: "#39D5D8"

  # Badges, tables, dialogs, and menus
  label-badge-background-color: "#194657"
  label-badge-text-color: "#D7F5F2"
  paper-dialog-background-color: "#123342"
  paper-listbox-background-color: "#123342"
  table-row-background-color: "#123342"
  table-row-alternative-background-color: "#102B38"
  data-table-background-color: "#123342"
  markdown-code-background-color: "#0A1B25"

  # Charts
  graph-color-1: "#39D5D8"
  graph-color-2: "#B6D58B"
  graph-color-3: "#F2D34F"
  graph-color-4: "#4B91B0"
  graph-color-5: "#FF4058"
  graph-color-6: "#8D9EE8"

  # Typography and selection
  paper-font-body1_-_font-family: "Roboto, sans-serif"
  paper-font-common-base_-_font-family: "Roboto, sans-serif"
  text-selection-color: "#0B202B"
  text-selection-background-color: "#63F0EA"
